name: iNDS Build Check

on:
  push:
    branches: [fix-audio]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: |
          gem install cocoapods --no-document
          pod install --repo-update
      - name: Remove obsolete ARM flags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          count = 0
          for path in Path(".").rglob("*"):
              if path.name == "project.pbxproj" or path.suffix == ".xcconfig":
                  text = path.read_text(encoding="utf-8")
                  if "-marm" in text:
                      print(f"Removing -marm from {path}")
                      path.write_text(text.replace("-marm", ""), encoding="utf-8")
                      count += 1

          print(f"Patched configuration files: {count}")
          PY
     
      - name: Fix DeSmuME WiFi macro
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("desmume/desmume/src/wifi.cpp")
          data = path.read_bytes()

          old = b'printf("WIFI: "__VA_ARGS__);'
          new = b'printf("WIFI: " __VA_ARGS__);'

          if data.count(old) != 1:
              raise SystemExit("WiFi macro not found exactly once")

          path.write_bytes(data.replace(old, new))
          print("WiFi macro patched successfully")
          PY
      - name: Fix DeSmuME cache masks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("desmume/desmume/src/MMU_timing.h")
          data = path.read_bytes()

          replacements = (
              (b"(u32)(~0 << TAGSHIFT)", b"(u32)(~0u << TAGSHIFT)"),
              (b"(u32)(~0 << BLOCKSIZESHIFT)", b"(u32)(~0u << BLOCKSIZESHIFT)"),
          )

          for old, new in replacements:
              if data.count(old) != 1:
                  raise SystemExit(f"Unexpected match count: {old!r}")
              data = data.replace(old, new)

          path.write_bytes(data)
          print("MMU cache masks patched successfully")
          PY
      - name: Fix DeSmuME libfat pointer check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("desmume/desmume/src/utils/libfat/directory.cpp")
          data = path.read_bytes()

          old = rb"while (count < len-1 && src != '\0')"
          new = rb"while (count < len-1 && *src != '\0')"

          count = data.count(old)
          print(f"Matched libfat statements: {count}")

          if count != 1:
              for line in data.splitlines():
                  if b"count < len" in line and b"src" in line:
                      print("Source:", repr(line))
              raise SystemExit("Unable to patch libfat condition")

          path.write_bytes(data.replace(old, new, 1))
          print("libfat pointer check patched successfully")
          PY
      - name: Fix DeSmuME SPU register writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("desmume/desmume/src/SPU.cpp")
          source = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'\*\(u(?P<bits>8|16)\*\)\('
              r'(?P<field>thischan\.(?:addr|timer|loopstart|length)|regs\.cap\[[01]\]\.(?:dad|len))'
              r' \+ (?P<index>[0-3])\)\s*=\s*(?P<value>[^;]+);'
          )

          def fix_register_write(match):
              bits = int(match["bits"])
              shift = int(match["index"]) * bits
              field = match["field"]
              value = match["value"].strip()

              bit_mask = (1 << bits) - 1
              shifted_mask = bit_mask << shift

              return (
                  f"{field} = ({field} & ~0x{shifted_mask:08X}u) | "
                  f"(((u32)({value}) & 0x{bit_mask:X}u) << {shift});"
              )

          patched, count = pattern.subn(fix_register_write, source)

          print(f"SPU register writes patched: {count}")

          if count != 32:
              raise SystemExit(
                  f"Expected 32 register fixes, found {count}"
              )

          path.write_text(patched, encoding="utf-8")
          print("SPU register patch completed successfully")
          PY
      - name: Fix iNDS controller enum types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("iNDS/iNDSEmulatorViewController.mm")
          data = path.read_bytes()

          fixes = [
              (
                  b'self.directionalControl.style = [defaults integerForKey:@"controlPadStyle"];',
                  b'self.directionalControl.style = (iNDSDirectionalControlStyle)[defaults integerForKey:@"controlPadStyle"];',
                  1
              ),
              (
                  b'controllerPressedDPad:0',
                  b'controllerPressedDPad:(iNDSDirectionalControlDirection)0',
                  4
              ),
              (
                  b'controllerPressedABXY:0',
                  b'controllerPressedABXY:(iNDSButtonControlButton)0',
                  4
              )
          ]

          for old, new, expected in fixes:
              found = data.count(old)
              print(f"Matches: {found}, expected: {expected}")
              if found != expected:
                  raise SystemExit("Unexpected controller code")

          for old, new, expected in fixes:
              data = data.replace(old, new)

          path.write_bytes(data)
          print("Controller enum types patched successfully")
          PY
      - name: Build iNDS
        run: |
          xcodebuild \
            -workspace iNDS.xcworkspace \
            -scheme iNDS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
                        CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_THUMB_SUPPORT=YES \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-c++11-narrowing' \
            build
      - name: Package unsigned IPA     
        run: |
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release-iphoneos/iNDS.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iNDS.app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          test -f "$APP_PATH/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -f "$APP_PATH/$EXECUTABLE"

          mkdir -p ipa-stage/Payload
          ditto "$APP_PATH" ipa-stage/Payload/iNDS.app

          (cd ipa-stage && zip -qry "$GITHUB_WORKSPACE/iNDS-unsigned.ipa" Payload)

          unzip -t iNDS-unsigned.ipa | tail -n 1
          ls -lh iNDS-unsigned.ipa
          echo "IPA packaging successful"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iNDS-fix-audio-IPA
          path: iNDS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
