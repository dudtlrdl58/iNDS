name: iNDS Build Check

on:
  push:
    branches: [fix-audio]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: |
          gem install cocoapods --no-document
          pod install --repo-update
      - name: Remove obsolete ARM flags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          count = 0
          for path in Path(".").rglob("*"):
              if path.name == "project.pbxproj" or path.suffix == ".xcconfig":
                  text = path.read_text(encoding="utf-8")
                  if "-marm" in text:
                      print(f"Removing -marm from {path}")
                      path.write_text(text.replace("-marm", ""), encoding="utf-8")
                      count += 1

          print(f"Patched configuration files: {count}")
          PY
      - name: Inspect DeSmuME build flags
        run: |
          xcodebuild -project iNDS.xcodeproj -target DeSmuME-OpenEmu -configuration Release -sdk iphoneos -showBuildSettings GCC_THUMB_SUPPORT=YES > /tmp/desmume-settings.txt
          grep -E 'THUMB|OTHER_CFLAGS|OTHER_CPLUSPLUSFLAGS|WARNING_CFLAGS' /tmp/desmume-settings.txt ||       
      - name: Fix DeSmuME WiFi macro
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("desmume/desmume/src/wifi.cpp")
          data = path.read_bytes()

          old = b'printf("WIFI: "__VA_ARGS__);'
          new = b'printf("WIFI: " __VA_ARGS__);'

          if data.count(old) != 1:
              raise SystemExit("WiFi macro not found exactly once")

          path.write_bytes(data.replace(old, new))
          print("WiFi macro patched successfully")
          PY
      - name: Build iNDS
        run: |
          xcodebuild \
            -workspace iNDS.xcworkspace \
            -scheme iNDS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
                        CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_THUMB_SUPPORT=YES \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-c++11-narrowing' \
            build
            
